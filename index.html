<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Неоновый рубеж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="stat"><span class="k" id="hLivesK">Ядро</span><b id="hLives">20</b></div>
    <div class="stat"><span class="k">Кредиты</span><b id="hGold">0</b></div>
    <div class="stat"><span class="k" id="hWaveK">Волна</span><b id="hWave">0/30</b></div>
    <div class="ctrls">
      <button id="bNext" class="primary">Старт ▶</button>
      <div class="seg" id="speed"><button data-s="1" class="on">×1</button><button data-s="2">×2</button><button data-s="3">×3</button><button data-s="5">×5</button><button data-s="7">×7</button></div>
      <button id="bPause" aria-label="Тактическая пауза" title="Тактическая пауза">❚❚</button>
      <button id="bMenu" aria-label="Меню паузы" title="Меню">☰</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="radial" hidden></div>
    <div id="tcard" hidden></div>
    <div id="toast"></div>
    <div id="comms" hidden role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5z"/><path d="M6.8 12h1.7l1.4-3 2.1 6 1.6-4.5 1 1.5h2.6"/></svg><p><b>ВЕГА</b><span id="commsT"></span></p></div>
    <div id="perkOv" class="ov" hidden><div class="pk" role="dialog" aria-modal="true" aria-labelledby="pkT"><h3 id="pkT">Выберите перк</h3><p id="pkSub">Действует до конца забега</p><div class="pks" id="pks"></div></div></div>
    <div id="achT"><span class="tr">◆</span><div><small>Достижение</small><b id="achName"></b></div></div>
    <div id="pauseOv" class="ov clear" hidden><div class="pz"><b>Пауза</b><span>Стройте и улучшайте, затем снимите паузу</span></div></div>
  </main>
  <section id="panel">
    <div id="coach" hidden><div class="cs"><span id="coachStep">Обучение</span><button id="coachSkip">Пропустить</button></div><div class="ct" id="coachText"></div><button class="ok" id="coachOk" hidden>Понятно</button></div>
    <div class="abil">
      <button class="ab" id="ab-orbital" data-ab="orbital" style="--c:#ff4fd8"><span class="fill"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg><span class="an">Удар</span><span class="cd"></span><kbd>Q</kbd></button>
      <button class="ab" id="ab-emp" data-ab="emp" style="--c:#3df0ff"><span class="fill"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="an">ЭМИ</span><span class="cd"></span><kbd>W</kbd></button>
      <button class="ab" id="ab-shield" data-ab="shield" style="--c:#6dff9e"><span class="fill"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 20.5 7v10L12 22 3.5 17V7z"/><path d="M12 7v10"/></svg><span class="an">Щит</span><span class="cd"></span><kbd>E</kbd></button>
    </div>
    <div class="info" id="info"></div>
  </section>

  <div id="sheet" class="layer" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <div class="grab"></div>
      <h2 id="shT">Пауза</h2>
      <p class="sub" id="shSub"></p>
      <div class="minis" id="shMinis"></div>
      <div id="shGoal" hidden></div>
      <div class="cta-glow"><button class="cta" id="shResume">Продолжить</button></div>
      <div class="pair"><button class="btn2" id="shSound">Звук включён</button><button class="btn2" id="shRestart">Начать заново</button></div>
      <button class="btn2" id="shExit">Выйти в лобби</button>
    </div>
  </div>

  <div id="end" class="layer" hidden><div class="res cut" id="res" role="dialog" aria-modal="true"></div></div>

  <div id="lobby" class="layer">
    <canvas id="lbBg" aria-hidden="true"></canvas>
    <div class="lb-view" id="lbView"></div>
    <nav class="lb-nav" id="lbNav" aria-label="Разделы">
      <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5z"/><circle cx="12" cy="12" r="2.6"/></svg><span>Главная</span></button>
      <button data-go="camp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18.5c0-5 5.5-3.5 6.5-8S17 6 18 5.5"/><circle cx="6" cy="18.5" r="2.2"/><circle cx="18" cy="5.5" r="2.2"/></svg><span>Кампания</span></button>
      <button data-go="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3h5M10.5 3v5.6L5.3 18.1A1.9 1.9 0 0 0 7 21h10a1.9 1.9 0 0 0 1.7-2.9L13.5 8.6V3M7.4 15h9.2"/></svg><span>Лаборатория</span></button>
      <button data-go="awards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4h9L20 9l-8 11L4 9z"/><path d="M4 9h16M9.5 4 12 9l2.5-5"/></svg><span>Награды</span></button>
      <button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Ещё</span></button>
    </nav>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
