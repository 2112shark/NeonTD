<!doctype html><html lang="ru"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Неоновый рубеж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: lobby is a full-screen app shell (screens + bottom tab bar), the battle is HUD strip / playfield / ability bar. One committed neon-arcade look: deep navy decks, cyan signal, magenta brand, gold for currency and rank. The neon-tube logo is the single loud element. */
:root{
  --bg:#05070f; --panel:#0a0f1f; --panel2:#0f1630; --line:#1c2645; --fg:#e3e8ff; --dim:#7a86b0;
  --accent:#3df0ff; --warn:#ff4d6d; --gold:#ffc94d; --ok:#6dff9e; --pink:#ff4fd8;
  --f-ui:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:8px;gap:8px;box-sizing:border-box}
@media (min-aspect-ratio:5/4) and (min-width:760px){
  #app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}
  #hud{grid-column:1/-1}
  #panel{grid-row:2;grid-column:2;align-self:start}
  .abil{grid-template-columns:1fr!important}
}
/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.stat{display:flex;flex-direction:column;line-height:1.05}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat b{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
#hLives{color:var(--warn)} #hGold{color:var(--gold)} #hWave{color:var(--accent)}
.ctrls{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrls>button,.seg button{background:var(--panel);border:1px solid var(--line);border-radius:6px;height:34px;padding:0 10px;font-weight:600;letter-spacing:.03em}
.seg{display:flex}
.seg button{border-radius:0;padding:0 8px;font-family:var(--f-num);font-size:13px}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button+button{border-left:0}
.seg button.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.primary{border-color:var(--accent)!important;color:var(--accent);box-shadow:0 0 12px rgba(61,240,255,.25),inset 0 0 10px rgba(61,240,255,.12)}
.primary:disabled{box-shadow:none;border-color:var(--line)!important;color:var(--dim)}
button:disabled{opacity:.55;cursor:default}
#bNext{min-width:124px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){#bNext{min-width:0;padding:0 8px;font-size:13px}.ctrls{margin-left:0;width:100%}.ctrls>button{padding:0 8px}.seg button{padding:0 5px;font-size:12px}#bNext{flex:1}}
/* Stage */
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#cv{display:block;border-radius:6px;box-shadow:0 0 0 1px var(--line),0 0 40px rgba(61,240,255,.07);touch-action:none}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;font-size:13px;z-index:4;
  background:rgba(5,7,15,.88);border:1px solid var(--line);padding:6px 12px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#achT{position:absolute;bottom:12px;left:50%;transform:translate(-50%,20px);opacity:0;transition:transform .35s,opacity .35s;z-index:4;pointer-events:none;
  display:flex;gap:10px;align-items:center;background:rgba(10,15,31,.95);border:1px solid var(--gold);border-radius:8px;padding:8px 14px;box-shadow:0 0 22px rgba(255,201,77,.3);max-width:calc(100% - 20px)}
#achT.show{opacity:1;transform:translate(-50%,0)}
#achT .tr{font-size:22px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
#achT small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#achT b{font-size:14px}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;justify-content:center;border-radius:6px;z-index:5}
.ov.clear{background:rgba(4,6,13,.35);pointer-events:none;align-items:flex-end;padding-bottom:12px}
.pz{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(5,7,15,.92);border:1px solid var(--accent);border-radius:8px;padding:8px 16px;box-shadow:0 0 18px rgba(61,240,255,.25)}
.pz b{font-size:16px;color:var(--accent)}
.pz span{font-size:12px;color:var(--dim)}
.layer{position:absolute;inset:0;z-index:20}
/* Cut-corner panel: game-HUD vernacular, used only for featured panels */
.cut{--bc:var(--line);position:relative;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.cut::after{content:"";position:absolute;top:0;right:0;width:16px;height:16px;pointer-events:none;background:linear-gradient(to bottom left,transparent calc(50% - 1px),var(--bc) calc(50% - 1px),var(--bc) calc(50% + 1px),transparent calc(50% + 1px))}
.cores{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:17px;background:rgba(61,240,255,.07);font-family:var(--f-num);font-weight:700;font-size:15px;flex:none}
.cores svg{width:16px;height:16px;color:var(--accent)}
.cta-glow{width:100%;filter:drop-shadow(0 0 14px rgba(61,240,255,.4))}
.cta-glow.pink{filter:drop-shadow(0 0 14px rgba(255,79,216,.45))}
.cta{position:relative;overflow:hidden;width:100%;height:58px;border:0;background:var(--accent);color:#03141b;font-size:19px;font-weight:700;letter-spacing:.02em;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);display:flex;align-items:center;justify-content:center}
.cta-glow.pink .cta{background:var(--pink);color:#1d0418}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);transform:translateX(-130%);animation:sheen 5s ease-in-out 1.6s infinite}
@keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cta:active{filter:brightness(1.15)}
.cta:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #fff}
.textbtn{align-self:center;min-height:40px;padding:0 12px;border:0;background:none;color:var(--accent);font-weight:600;font-size:14px}
.textbtn.danger{color:var(--warn)}
.btn2{height:48px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-weight:700;font-size:15px}
.btn2.off{color:var(--dim)}
.btn2.warnish{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.pair{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:rgba(10,15,31,.94);border:1px solid var(--line);border-radius:10px}
.segs button{--sc:var(--accent);height:40px;padding:0 6px;border:0;border-radius:7px;background:none;color:var(--dim);font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 65%,transparent),0 0 12px color-mix(in srgb,var(--sc) 22%,transparent)}

/* ---------- lobby shell ---------- */
#lobby{display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#lbBg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lb-view{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.lb-in{max-width:540px;min-height:100%;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.lb-in.wide{max-width:780px}
.lb-view.enter .lb-in{animation:scrIn .22s ease-out}
.lb-view.enter.sub .lb-in{animation:subIn .24s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}}
@keyframes subIn{from{opacity:0;transform:translateX(28px)}}
.lb-head{display:flex;align-items:center;gap:10px;min-height:42px}
.lb-head h2{flex:1;min-width:0;margin:0;font-size:24px;font-weight:700;text-wrap:balance}
.back{flex:none;width:42px;height:42px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.back svg{width:20px;height:20px}
.lead{margin:0;max-width:62ch;color:var(--dim);font-size:14px;line-height:1.5}
.sec{margin:4px 0 0;font-size:17px;font-weight:700}
.lb-nav{position:relative;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,112px));justify-content:center;background:rgba(6,9,20,.95);border-top:1px solid var(--line)}
.lb-nav button{position:relative;height:62px;min-width:0;padding:0 1px;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600}
@media (max-width:420px){.lb-nav button{font-size:10px;letter-spacing:-.01em}}
.lb-nav svg{width:22px;height:22px}
.lb-nav span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-nav button.on{color:var(--accent)}
.lb-nav button.on svg{filter:drop-shadow(0 0 6px rgba(61,240,255,.85))}
.lb-nav button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.lb-nav .dot{position:absolute;top:11px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}

/* ---------- logo: neon tube lettering ---------- */
.logo{display:flex;justify-content:center;padding:6px 0 2px}
.lg{display:block;width:min(86%,340px);height:auto;overflow:visible}
.lg use{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lg .tg{stroke:var(--accent);stroke-width:10;opacity:.5}
.lg .tt{stroke:var(--accent);stroke-width:5}
.lg .tc{stroke:#eafeff;stroke-width:1.6}
.lg .em .tg{stroke-width:6}
.lg .em .tt{stroke-width:2.4}
.lg .pg{stroke:var(--pink);stroke-width:5;opacity:.55}
.lg .pt{stroke:var(--pink);stroke-width:2.2}
.lg .pc{stroke:#ffe6f9;stroke-width:.7}
.lg .sg{stroke:var(--accent);stroke-width:1.2;opacity:.45}
.lg .dotc{fill:#fff}
.lg .nd{fill:var(--pink)}
.lg .scan{stroke:#fff;stroke-width:2.2;stroke-dasharray:18 320;animation:scan 5.5s linear infinite}
@keyframes scan{from{stroke-dashoffset:338}to{stroke-dashoffset:0}}
.lg .spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lg .fl{animation:flick 7s steps(1) 3s infinite}
@keyframes flick{0%,86%,100%{opacity:1}87%{opacity:.25}88%{opacity:1}89.5%{opacity:.4}91%{opacity:1}}
.lg.boot .L{animation:ignite 1s backwards;animation-delay:calc(.25s + var(--i) * .13s)}
.lg.boot .em,.lg.boot .pkw,.lg.boot .wall{animation:fadeIn .6s backwards}
.lg.boot .pkw{animation-delay:.95s}
.lg.boot .wall{animation-delay:1.15s}
@keyframes ignite{0%{opacity:.06}18%{opacity:.9}26%{opacity:.12}38%{opacity:1}50%{opacity:.35}60%,100%{opacity:1}}
@keyframes fadeIn{from{opacity:0}}
@media (max-height:700px){.lg{width:min(70%,290px)}}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 4px 4px 0;border:0;background:none;text-align:left}
.rank svg{flex:none;width:22px;height:28px;color:var(--gold);filter:drop-shadow(0 0 5px rgba(255,201,77,.55))}
.rank span{min-width:0}
.rank b{display:block;font-size:15px}
.rank small{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.cta-sub{margin:0;text-align:center;color:var(--dim);font-size:13px}
.dcard{--bc:color-mix(in srgb,var(--pink) 55%,transparent);width:100%;display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:7px 14px;align-items:start;padding:14px 16px;border:1px solid var(--bc);background:linear-gradient(135deg,rgba(255,79,216,.13),rgba(10,15,31,.94) 58%);text-align:left}
.dcard .dh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dcard .dh b{font-size:15px;color:var(--pink)}
.timer{font-family:var(--f-num);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.dcard .dm{font-size:21px;font-weight:700;line-height:1.15}
.dcard canvas{grid-column:2;grid-row:2/5;width:58px;height:73px;border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.dcard .chips{display:flex;flex-wrap:wrap;gap:4px}
.dcard .dstats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--dim)}
.dcard .dstats b{display:block;font-family:var(--f-num);font-size:15px;color:var(--fg)}
.okmark{align-self:end;color:var(--ok);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-height:96px;padding:14px;border:1px solid var(--line);border-radius:10px;background:rgba(10,15,31,.92);text-align:left}
.tile svg{width:22px;height:22px;color:var(--accent)}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--dim);line-height:1.35}

/* ---------- maps ---------- */
.carousel{--cw:min(224px,60vw);position:relative;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin:0 -16px;padding:6px calc(50% + 16px - var(--cw) / 2) 10px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mcard{--bc:var(--line);flex:0 0 var(--cw);scroll-snap-align:center;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--bc);background:rgba(10,15,31,.94);text-align:left;opacity:.55;transform:scale(.94);transition:opacity .2s,transform .2s}
.mcard.on{--bc:var(--accent);opacity:1;transform:none;background:linear-gradient(180deg,rgba(61,240,255,.08),rgba(10,15,31,.96) 45%)}
.mcard canvas{display:block;width:100%;height:auto;aspect-ratio:12/15;border-radius:4px}
.mt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mt b{font-size:17px}
.mstars{display:flex;gap:2px}
.mstars svg{width:16px;height:16px;fill:#27304f}
.mstars svg.on{fill:var(--gold);filter:drop-shadow(0 0 4px rgba(255,201,77,.7))}
.rec{font-family:var(--f-num);font-size:13px;color:var(--accent);white-space:nowrap}
.diff{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
.diff i{width:14px;height:5px;background:#232d55;transform:skewX(-24deg)}
.diff i.on{background:var(--dc);box-shadow:0 0 6px var(--dc)}
.diff em{margin-left:4px;font-style:normal}
.dots{display:flex;justify-content:center;gap:7px;margin-top:-6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#2a3560}
.dots i.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}
@media (min-width:720px){.carousel{display:grid;grid-template-columns:repeat(3,1fr);margin:0;padding:0;overflow:visible}.mcard{transform:none;opacity:.7}.mcard.on{opacity:1}.dots{display:none}}
.brief{display:flex;flex-direction:column;gap:10px}
.brief p{margin:0;color:var(--dim);line-height:1.5}
.facts{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{min-width:0;padding:10px 12px;background:rgba(10,15,31,.96)}
.facts dt{font-size:12px;color:var(--dim)}
.facts dd{margin:3px 0 0;font-family:var(--f-num);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticky{position:sticky;bottom:0;z-index:2;margin:auto -16px -24px;padding:24px 16px 18px;background:linear-gradient(rgba(5,7,15,0),var(--bg) 22px)}
.note{margin:8px 0 0;text-align:center;font-size:12px;color:var(--dim)}

/* ---------- lab ---------- */
.nodes{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(10,15,31,.94)}
.nodes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px}
.nodes li+li{border-top:1px solid var(--line)}
.nodes b{font-size:15px}
.nodes p{margin:3px 0 0;font-size:13px;color:var(--dim);line-height:1.4}
.pips{display:flex;gap:4px;margin-top:9px}
.pips i{width:18px;height:5px;background:#202a50;transform:skewX(-24deg)}
.pips i.on{background:var(--bc);box-shadow:0 0 6px var(--bc)}
.buy{min-width:96px;height:46px;padding:0 12px;border:1px solid var(--bc);border-radius:9px;background:color-mix(in srgb,var(--bc) 14%,var(--panel2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:13px}
.buy em{display:flex;align-items:center;gap:4px;font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--accent)}
.buy em svg{width:12px;height:12px}
.buy:disabled{border-color:var(--line);background:var(--panel2);color:var(--dim)}
.buy:disabled em{color:var(--dim)}
.done{font-size:13px;font-weight:700;color:var(--bc)}

/* ---------- awards ---------- */
.rankcard{--bc:color-mix(in srgb,var(--gold) 55%,transparent);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;padding:16px;border:1px solid var(--bc);background:linear-gradient(135deg,rgba(255,201,77,.11),rgba(10,15,31,.95) 60%)}
.rankcard svg{grid-row:1/3;width:36px;height:46px;color:var(--gold);filter:drop-shadow(0 0 7px rgba(255,201,77,.6))}
.rankcard b{font-size:21px}
.rk-n{font-size:13px;color:var(--dim)}
.bar{grid-column:1/-1;display:block;height:8px;margin-top:8px;border-radius:4px;background:#1b2340;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff0b8);box-shadow:0 0 10px rgba(255,201,77,.6)}
.earn{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.earn li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(10,15,31,.94);font-size:12px;color:var(--dim)}
.earn b{display:block;font-family:var(--f-num);font-size:18px;color:var(--fg)}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cnt{font-family:var(--f-num);font-size:13px;color:var(--dim)}
.achl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.achl li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(10,15,31,.94)}
.achl svg{flex:none;width:24px;height:24px;color:#2b3560}
.achl b{display:block;font-size:14px;color:#aab3d4}
.achl span{display:block;font-size:12px;color:var(--dim);line-height:1.35}
.achl li.got{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.achl li.got svg{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,201,77,.6))}
.achl li.got b{color:var(--fg)}

/* ---------- more ---------- */
.mlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(10,15,31,.94)}
.mlist li+li{border-top:1px solid var(--line)}

.sw{flex:none;position:relative;width:46px;height:28px;border-radius:14px;background:#1f2a4d;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw.on{background:color-mix(in srgb,var(--accent) 32%,#0f1630)}

.kbd-sec{display:flex;flex-direction:column;gap:10px}
.keys{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;color:var(--dim)}
.keys dt{font-family:var(--f-num);color:var(--fg)}

.ver{margin:0;text-align:center;font-size:12px;color:#7a86b4}

/* ---------- daily ---------- */
.dhero{--bc:color-mix(in srgb,var(--pink) 55%,transparent);display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center;padding:12px;border:1px solid var(--bc);background:linear-gradient(135deg,rgba(255,79,216,.13),rgba(10,15,31,.95) 60%)}

/* ---------- codex ---------- */
.cx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cx li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(10,15,31,.94)}

.cx .nm span{font-family:var(--f-num);font-size:12px;color:var(--gold);white-space:nowrap}
.cx p{margin:0;font-size:13px;color:var(--dim);line-height:1.45}
.cxm{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13px;color:var(--dim);line-height:1.45}

.stt{width:100%;border-collapse:collapse;font-size:12px}

.stt tr+tr td{border-top:1px solid var(--line)}

/* ---------- pause sheet ---------- */
#sheet{display:flex;align-items:flex-end;justify-content:center;background:rgba(3,5,12,.6)}
.sheet{width:100%;max-width:480px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:10px 16px 18px;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;background:var(--panel);box-shadow:0 -12px 40px rgba(0,0,0,.55);animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(48px);opacity:0}}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#2a3560}
.sheet h2{margin:0;font-size:22px}
.sheet .sub{margin:-6px 0 0;font-size:13px;color:var(--dim)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

@media (min-width:600px){#sheet{align-items:center}.sheet{border-radius:16px;border-bottom:1px solid var(--line)}}

/* ---------- results ---------- */
#end{display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;background:rgba(3,5,12,.84);box-sizing:border-box}
.res{--bc:var(--line);width:100%;max-width:420px;margin:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 18px 18px;border:1px solid var(--bc);background:linear-gradient(180deg,rgba(15,22,48,.98),rgba(10,15,31,.98));text-align:center}
.res.win{--bc:color-mix(in srgb,var(--accent) 60%,transparent)}
.res.lose{--bc:color-mix(in srgb,var(--warn) 55%,transparent)}
.res h2{margin:0;font-size:28px;line-height:1.1}
.res .sub{margin:-8px 0 0;font-size:13px;color:var(--dim)}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:48px;height:48px;fill:#26304f}

@keyframes starIn{from{transform:scale(0) rotate(-45deg);opacity:0}}
.score{font-family:var(--f-num);font-size:40px;font-weight:700;line-height:1;text-shadow:0 0 14px rgba(61,240,255,.5)}
.badge{font-size:13px;font-weight:700;color:var(--gold)}
.rstats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rstats div{padding:10px 12px;background:var(--panel2);text-align:left}
.rstats span{display:block;font-size:12px;color:var(--dim)}
.rstats b{font-family:var(--f-num);font-size:18px}
.rew{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.rew span{padding:4px 10px;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:14px;font-size:12px;color:var(--gold)}
.rew .core{border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent)}
.racts{width:100%;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){.cta::after,.lb-view.enter .lb-in,.sheet,.bigstars svg.on,.lg *{animation:none!important}}

/* Radial ring */
#radial{position:absolute;width:0;height:0;z-index:3}
#radial .ring{position:absolute;left:-94px;top:-94px;width:188px;height:188px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(5,7,15,0) 0 26%,rgba(5,7,15,.5) 42% 72%,rgba(5,7,15,0) 73%);border:1px solid rgba(61,240,255,.14);animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.rng{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--c) 75%,transparent);background:color-mix(in srgb,var(--c) 3%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--c) 18%,transparent);pointer-events:none;z-index:2}

.rng span{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);font-family:var(--f-num);font-size:10px;line-height:1;color:var(--c);background:var(--bg);border:1px solid var(--c);border-radius:4px;padding:2px 5px;white-space:nowrap}
.rng.nx span{top:auto;bottom:0;transform:translate(-50%,50%)}
#radial.pv .ring{background:none;border-color:transparent}
#radial.pv .ri:not(.on){opacity:.3}
#radial.pv .ri.on{background:color-mix(in srgb,var(--c) 14%,rgba(15,22,48,.55))}
#radial.pv .ri,#radial.pv .ring{animation:none}
.ri{position:absolute;transform:translate(-50%,-50%);animation:pop .16s ease-out backwards}
.ri.tw{width:52px;height:52px;border-radius:50%;background:var(--panel2);border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0}
.ri.tw canvas{width:30px;height:30px}
.ri .c{font-family:var(--f-num);font-size:10px;color:var(--gold);line-height:1}
.ri.poor .c{color:var(--warn)}
.ri.on{background:color-mix(in srgb,var(--c) 22%,var(--panel2));box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent);border-color:var(--c)}
.ri.act{min-width:78px;max-width:96px;min-height:44px;border-radius:10px;background:var(--panel2);border:1.5px solid var(--line);padding:4px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:11px;font-weight:600}
.ri.act .c{font-size:11px;margin-top:2px}
.ri.act.on{border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.ri.act.sell .c{color:var(--ok)}
.ri.act:disabled{opacity:.5}
.rc{position:absolute;transform:translate(-50%,-50%);border-radius:5px;background:rgba(61,240,255,.08);border:2.5px solid var(--accent);padding:0;z-index:3;
  box-shadow:0 0 0 2px rgba(5,7,15,.85),0 0 18px rgba(61,240,255,.85),inset 0 0 10px rgba(61,240,255,.4);animation:tileGlow 1s ease-in-out infinite}
.rc i{position:absolute;right:-11px;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:1.5px solid var(--accent);color:var(--accent);font-style:normal;font-size:11px;font-weight:700;line-height:17px;text-align:center}
.rc.go{border-color:var(--ok);background:rgba(109,255,158,.08);box-shadow:0 0 0 2px rgba(5,7,15,.85),0 0 18px rgba(109,255,158,.85),inset 0 0 10px rgba(109,255,158,.4)}
.rc.go i{border-color:var(--ok);color:var(--ok)}
@keyframes tileGlow{50%{transform:translate(-50%,-50%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.rc{animation:none}}
/* Tower card: stats and upgrade preview, docked to the stage edge away from the ring */
#tcard{--tc:var(--accent);position:absolute;left:50%;transform:translateX(-50%);z-index:6;width:min(calc(100% - 16px),400px);box-sizing:border-box;display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);border-radius:10px;background:rgba(7,10,22,.95);box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 16px color-mix(in srgb,var(--tc) 18%,transparent);pointer-events:none}

/* Panel */
#panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}

function mkRoute(pts){
  const path=pts.map(p=>({x:p[0]+.5,y:p[1]+.5}));let len=0;for(let i=1;i<path.length;i++)len+=Math.sqrt(d2(path[i],path[i-1]));
  const air=path.filter((p,i)=>i%2===0||i===path.length-1);let airLen=0;for(let i=1;i<air.length;i++)airLen+=Math.sqrt(d2(air[i],air[i-1]));
  return{pts,path,air,len,airLen,core:0};
}

  m.routes=L.r.map(mkRoute);m.fork=L.fork==null?null:L.fork;
  m.grid=[...Array(ROWS)].map(()=>Array(COLS).fill(0));
  const inb=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
  for(const rt of m.routes)for(let i=0;i<rt.pts.length-1;i++){
    let [x,y]=rt.pts[i];const [x1,y1]=rt.pts[i+1];const sx=Math.sign(x1-x),sy=Math.sign(y1-y);
    for(;;){if(inb(x,y))m.grid[y][x]=1;if(x===x1&&y===y1)break;x+=sx;y+=sy}
  }
  const same=(a,x,y)=>Math.abs(a.x-x)<.01&&Math.abs(a.y-y)<.01;
  m.cores=[];m.gates=[];
  for(const rt of m.routes){const e=rt.path[rt.path.length-1],x=clamp(e.x,.5,COLS-.5),y=clamp(e.y,.5,ROWS-.5);
    let k=m.cores.findIndex(c=>same(c,x,y));if(k<0){k=m.cores.length;m.cores.push({x,y})}rt.core=k;
    const s=rt.path[0],gx=clamp(s.x,.5,COLS-.5),gy=clamp(s.y,.5,ROWS-.5);if(!m.gates.some(g=>same(g,gx,gy)))m.gates.push({x:gx,y:gy})}
  const R=rng(m.seed);let n=0,g=0;
  while(n<11&&g++<800){const c=R()*COLS|0,r=R()*ROWS|0;if(m.grid[r][c])continue;
    let near=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inb(c+dx,r+dy)&&m.grid[r+dy][c+dx]===1)near=true;
    if(!near){m.grid[r][c]=2;n++}}
  m.nodes=[];m.debris=[];
  const R2=rng(m.seed+555),cand=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(m.grid[r][c]!==0)continue;let adj=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(inb(c+dx,r+dy)&&m.grid[r+dy][c+dx]===1)adj=true;if(adj)cand.push([c,r])}
  const take=()=>cand.length?cand.splice(R2()*cand.length|0,1)[0]:null;
  for(let k=0;k<(m.nodeN||0);k++){const q=take();if(q){m.grid[q[1]][q[0]]=3;m.nodes.push(q)}}
  for(let k=0;k<(m.debrisN||0);k++){const q=take();if(q){m.grid[q[1]][q[0]]=4;m.debris.push(q)}}
  const r0=m.routes[0];m.path=r0.path;m.air=r0.air;m.airLen=r0.airLen;m.len=Math.max(...m.routes.map(r=>r.len));
  m.ready=true;return m;
}

const CLASSIC_T=[['drone',1],['scout',2],['tank',4],['wasp',5],['guard',7],['medic',8],['split',9],['blink',11],['jammer',13],['carrier',15]];
const NUM={drone:w=>4+w/4,scout:w=>5+w/3,tank:w=>2+w/5,wasp:w=>4+w/4,guard:w=>4+w/4,split:w=>2+w/6,medic:w=>2+w/7,jammer:w=>1+w/8,blink:w=>3+w/5,carrier:w=>1+w/7};

function genWave0(w){
  const M=S.mis,R=rng(w*7919+(M?M.i*977+(S.nm?3:0)+40000:S.mi*131)+5),mods=waveMods(w);
  const types=M?Object.keys(M.roster).filter(k=>M.roster[k]<=w).sort((a,b)=>M.roster[a]-M.roster[b]):CLASSIC_T.filter(x=>x[1]<=w).map(x=>x[0]);
  const lanes=S.map.cores.length>1?S.map.routes.length:1;
  const q=[],groups=(S.flow?1:2)+Math.floor(w/(S.flow?6:5));
  for(let g=0;g<groups;g++){
    const t=g===0?types[types.length-1]:types[R()*types.length|0];
    let n=Math.floor(NUM[t](w)),gap=GAP[t]||.7;
    if(mods.includes('swarm')){n=Math.ceil(n*1.5);gap*=.7}
    const l=(g+w)%lanes;
    for(let i=0;i<n;i++)q.push({t,d:i===0?(g===0?1:2.2):gap,l});
  }

  if(S.flow)return S.started?`<b>Поток.</b> Новая группа каждые 10 с, до продувки ${fmtTime(Math.max(0,S.flowLeft))}.`:'<b>Поток:</b> три минуты непрерывных волн. Подготовьтесь и нажмите «Старт».';
  const mw=maxW();if(S.wave>=mw&&!S.waveActive)return'';
  const w=S.wave+1;if(w>mw)return'<b>Последняя волна</b>';
  const q=genWave(w),c={};q.forEach(o=>c[o.t]=(c[o.t]||0)+1);const mods=waveMods(w);
  return`<b>Волна ${w}:</b> `+Object.entries(c).map(([k,n])=>`<span style="color:${ED[k].col}">${ED[k].name}</span> ${n}`).join(' · ')+mods.map(k=>` <span class="chip" style="--cc:${MODS[k].col}">${MODS[k].name}: ${MODS[k].desc}</span>`).join('');
}

function act(a,v){

  switch(a){

    case'chap':snd('tap');LBY.chap=+v;go('camp',true);break;
    case'mis':snd('tap');LBY.mis=+v;LBY.nm=false;go('mission');break;
    case'nm':snd('tap');LBY.nm=v==='1';go('mission',true);break;
    case'mstart':launch(LBY.mis,'campaign',{nm:LBY.nm&&mDone(LBY.mis)});break;
    case'sel':snd('tap');selMap(+v,true);break;
    case'start':launch(LBY.sel,'endless');break;
    case'daily-start':launch(0,'daily');break;
    case'weekly-start':launch(0,'weekly');break;
    case'season':snd('tap');LBY.atab='season';go('awards');break;
    case'showedit':snd('tap');LBY.atab='ach';go('awards');break;
    case'show':{const sh=PROG.show=(PROG.show||[]).filter(id=>PROG.ach[id]),i=sh.indexOf(v);if(i>=0)sh.splice(i,1);else{sh.push(v);if(sh.length>3)sh.shift()}saveProg();snd('tap');go('awards',true);break}
    case'skin':{const [k,id]=v.split(':');if(skinOwned(k,id)){PROG.skin=PROG.skin||{};PROG.skin[k]=id;saveProg();snd('tap');go('lab',true)}break}
    case'title':PROG.title=v;saveProg();snd('tap');go('profile',true);break;
    case'kfx':PROG.kfx=v;saveProg();snd('tap');go('profile',true);break;
    case'quests':snd('tap');LBY.atab='quests';go('awards');break;
    case'atab':snd('tap');LBY.atab=v;go('awards',true);break;
    case'claim':if(claimQuest(v)){snd('up');vib(15);go('awards',true)}break;
    case'labtab':LBY.labTab=+v;if(+v===2){PROG.shopSeen=ptsFree();saveProg()}snd('tap');go('lab',true);break;
    case'buy':if(shopBuy(v)){PROG.shopSeen=ptsFree();saveProg();snd('up');vib(15);go('lab',true)}break;
    case'learn':{const n=LAB.find(x=>x.id===v),lv=labRaw(n.id);if(lv<n.max&&ptsFree()>=n.cost[lv]){PROG.lab[n.id]=lv+1;saveProg();snd('up');vib(15);go('lab',true)}break}
    case'labreset':if(!armed){LBY.arm=a;go('lab',true);break}LBY.arm=null;PROG.lab={};saveProg();snd('sell');go('lab',true);break;
    case'codex':LBY.codex=v;snd('tap');go('codex',true);break;
    case'toggle':if(v==='sound'){muted=!muted;PROG.set.sound=!muted;if(!muted)snd('tap')}else{PROG.set.vib=!PROG.set.vib;vib(25)}saveProg();go('more',true);break;
    case'tut':PROG.tut=0;saveProg();launch(0,'campaign');break;

      PROG=Object.assign(freshProg(),{set:PROG.set,v:3});saveProg();LBY.arm=null;if(S)S.started=false;snd('sell');go('home');break;
  }
}

/* lobby background: honeycomb with travelling data pulses */
const LBC=$('#lbBg'),lbx=LBC.getContext('2d'),HS=24,T1=[30,150,270],T2=[90,210,330];
let lbW=0,lbH=0,lbSt=null,PUL=[],lbT=0;
function newPulse(spread){const hw=Math.sqrt(3)*HS,row=Math.floor(Math.random()*(lbH/(1.5*HS)+1)),col=Math.floor(Math.random()*(lbW/hw+1));
  return{x:col*hw+(row&1?hw/2:0),y:row*1.5*HS-HS,ty:1,dir:T1[Math.random()*3|0],t:spread?Math.random():0,trail:[],age:spread?1:0,life:5+Math.random()*8,spd:1.4+Math.random()*1.6,col:Math.random()<.3?'#ff4fd8':'#3df0ff'}}
function lbResize(){
  const w=LOBBY.clientWidth,h=LOBBY.clientHeight;if(!w||!h)return;lbW=w;lbH=h;const d=Math.min(2,devicePixelRatio||1);
  LBC.width=Math.round(w*d);LBC.height=Math.round(h*d);
  lbSt=document.createElement('canvas');lbSt.width=LBC.width;lbSt.height=LBC.height;const g=lbSt.getContext('2d');g.setTransform(d,0,0,d,0,0);
  const gr=g.createRadialGradient(w/2,h*.2,0,w/2,h*.3,Math.max(w,h)*.9);gr.addColorStop(0,'#0e1838');gr.addColorStop(.55,'#070b1a');gr.addColorStop(1,'#04060d');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(61,240,255,.055)';g.lineWidth=1;g.beginPath();const hw=Math.sqrt(3)*HS;
  for(let row=-1;row*1.5*HS<h+HS*2;row++)for(let col=-1;col*hw<w+hw;col++){const cx=col*hw+(row&1?hw/2:0),cy=row*1.5*HS;
    for(let k=0;k<=6;k++){const a=(k*60-90)*Math.PI/180,x=cx+Math.cos(a)*HS,y=cy+Math.sin(a)*HS;if(k)g.lineTo(x,y);else g.moveTo(x,y)}}
  g.stroke();
  const vg=g.createLinearGradient(0,0,0,h);vg.addColorStop(0,'rgba(4,6,13,0)');vg.addColorStop(.6,'rgba(4,6,13,.3)');vg.addColorStop(1,'rgba(4,6,13,.85)');g.fillStyle=vg;g.fillRect(0,0,w,h);
  PUL=[];const n=clamp(Math.round(w*h/42000),5,12);for(let i=0;i<n;i++)PUL.push(newPulse(true));
  lbx.setTransform(d,0,0,d,0,0);lbDraw(0);
}
function stepPulse(p,dt){p.t+=dt*p.spd;p.age+=dt;p.life-=dt;
  while(p.t>=1){p.t-=1;const a=p.dir*Math.PI/180;p.trail.push([p.x,p.y]);if(p.trail.length>3)p.trail.shift();p.x+=Math.cos(a)*HS;p.y+=Math.sin(a)*HS;
    const set=p.ty?T2:T1;p.ty=p.ty?0:1;const rev=(p.dir+180)%360,opts=set.filter(d=>d!==rev);p.dir=opts[Math.random()*opts.length|0]}}
function lbDraw(dt){
  if(!lbSt)return;lbx.drawImage(lbSt,0,0,lbW,lbH);if(RM)return;
  lbx.globalCompositeOperation='lighter';lbx.lineCap='round';
  PUL.forEach((p,i)=>{stepPulse(p,dt);if(p.life<=0||p.x<-HS*2||p.x>lbW+HS*2||p.y<-HS*2||p.y>lbH+HS*2){PUL[i]=newPulse(false);return}
    const a=p.dir*Math.PI/180,hx=p.x+Math.cos(a)*HS*p.t,hy=p.y+Math.sin(a)*HS*p.t,pts=[...p.trail,[p.x,p.y],[hx,hy]],f=Math.min(1,p.age/.8,p.life/1.2);
    for(let k=1;k<pts.length;k++){const al=k/pts.length*.34*f;lbx.beginPath();lbx.moveTo(pts[k-1][0],pts[k-1][1]);lbx.lineTo(pts[k][0],pts[k][1]);
      lbx.strokeStyle=hexA(p.col,al*.22);lbx.lineWidth=5;lbx.stroke();lbx.strokeStyle=hexA(p.col,al);lbx.lineWidth=1.4;lbx.stroke()}
    lbx.fillStyle=hexA(p.col,.55*f);lbx.beginPath();lbx.arc(hx,hy,1.7,0,7);lbx.fill()});
  lbx.globalCompositeOperation='source-over';
}
function lbFrame(dt){lbDraw(dt);lbT+=dt;if(lbT>=1){lbT=0;if(dayKey()!==LBY.day){LBY.day=dayKey();go(LBY.scr,true)}else LBV.querySelectorAll('[data-timer]').forEach(el=>el.textContent=timeLeft())}}
new ResizeObserver(lbResize).observe(LOBBY);

  else if(m==='daily')hero=`<div class="score">${fmtN(r.score)}</div>${r.newBest?'<span class="badge">Лучший счёт за сегодня</span>':''}`;
  else hero=`<div class="score">Волна ${S.wave}</div>${S.newRec?'<span class="badge">Новый рекорд карты</span>':''}`;
  const stats=[[S.flow?'Групп':'Волна',m==='endless'||S.flow?S.wave:`${S.wave} из ${maxW()}`],['Уничтожено',S.kills],[S.coreHp?'Ядра':'Ядро',S.coreHp?S.coreHp.join(' и '):`${S.lives} из ${S.maxLives}`],['Время',fmtTime(S.time)]];
  const nx=M&&win&&!S.nm?MISSIONS[M.i+1]:null;
  const main=nx?['next','Следующая миссия']:['retry','Ещё раз'];
  const second=nx?[['retry','Ещё раз'],['lobby','В лобби']]:[['lobby','В лобби']];
  let rew=(gained>0?`<span class="core">+${gained} ${plural(gained,['ядро','ядра','ядер'])} данных</span>`:'');
  if(M&&win&&r.first&&!S.nm){if(nx){const nt=TYPES.find(k=>TW_UNLOCK[k]===nx.i);rew+=`<span class="core">Открыта миссия ${nx.i+1}</span>`;if(nt)rew+=`<span>Новая башня: ${TD[nt].name}</span>`}rew+=`<span>Открыт «Кошмар»</span>`}
  if(S.xpGain)rew+=`<span class="xp">+${S.xpGain} опыта сезона</span>`;
  const def=seasonInfo().def;for(const t of S.newTiers||[])rew+=`<span class="xp">Ступень ${t}: ${rewName(tierRew(def,t))}</span>`;
  for(const [k,l] of S.mastUp||[])rew+=`<span>${TD[k].name}: мастерство ${l}</span>`;
  rew+=S.newAch.map(n=>`<span>${n}</span>`).join('');
  const res=$('#res');res.className='res cut '+(win?'win':'lose');
  res.innerHTML=`<h2 style="color:${win?'var(--accent)':'var(--warn)'}">${title}</h2><p class="sub">${M?runName():`${S.map.name}, ${MODE_RU[m]}`}</p>${hero}${quote}
  <div class="rstats">${stats.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  ${rew?`<div class="rew">${rew}</div>`:''}
  <div class="racts"><div class="cta-glow"><button class="cta" data-act="${main[0]}">${main[1]}</button></div><div class="pair">${second.map(([k,l])=>`<button class="btn2" data-act="${k}">${l}</button>`).join('')}</div>
  ${free>0&&!fair()?`<button class="textbtn" data-act="lab">Ядер в Лаборатории: ${free}. Потратить</button>`:''}</div>`;
  END.hidden=false;
}
END.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;initAudio();const a=b.dataset.act;
  if(a==='next'){LBY.mis=S.mis.i+1;LBY.nm=false;LBY.chap=MISSIONS[LBY.mis].ch;openLobby('mission','camp')}
  else if(a==='retry'){END.hidden=true;rerun()}
  else if(a==='lobby')openLobby('home');
  else if(a==='lab')openLobby('lab')});

/* ---------- input ---------- */
function tileAt(ev){const r=cv.getBoundingClientRect();return[Math.floor((ev.clientX-r.left)/tile),Math.floor((ev.clientY-r.top)/tile)]}
cv.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse'){S.hover=tileAt(ev);if(S.place)updInfo()}});
cv.addEventListener('pointerleave',()=>{S.hover=null});
function worldAt(ev){const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/tile,(ev.clientY-r.top)/tile]}
cv.addEventListener('pointerdown',ev=>{
  initAudio();if(S.over||S.perkPick)return;const [c,r]=tileAt(ev);S.hover=[c,r];
  if(S.aim==='orbital'){castOrbital(c+.5,r+.5);return}
  const tw=towerAt(c,r);
  if(!S.place){const [wx,wy]=worldAt(ev),en=enemyAt(wx,wy);
    if(en){const free=tw||canBuild(c,r),dd=(en.x-wx)**2+(en.y-(en.air?.12:0)-wy)**2;if(!free||dd<.1){closeRadial();S.said.focusTip=1;setFocus(en);return}}
    const ft=forkTile();if(ft&&ft[0]===c&&ft[1]===r){closeRadial();S.said.fork=1;toggleFork();return}}
  if(S.place){
    if(tw){S.place=null;openRadial(c,r);return}
    if(canBuild(c,r)){const why=buildBlock(S.place);if(why){toast(why);S.place=null}else if(S.gold>=tcost(S.place)){build(S.place,c,r);if(S.gold<tcost(S.place))S.place=null}else toast('Не хватает кредитов')}
    else S.place=null;
    updInfo(true);return;
  }
  if(S.rad&&S.rad.c===c&&S.rad.r===r){closeRadial();return}
  if(tw||canBuild(c,r)||isDebris(c,r))openRadial(c,r);else closeRadial();
});
addEventListener('keydown',ev=>{
  const k=(ev.key||'').toLowerCase();
  if(lobbyOn()){if(k==='escape'&&SUB[LBY.scr])go(LBY.back||'home');return}
  if(!SHEET.hidden){if(k==='escape')closeSheet();return}
  if(!END.hidden||!S||S.over)return;
  if(S.perkPick){const i=+k-1;if(k>='1'&&k<='4'&&S.perkPick[i])takePerk(S.perkPick[i]);return}
  if(k>='1'&&k<='7'){initAudio();closeRadial();const ty=TYPES[+k-1];if(!ty||!shown(ty)||!S.allowed.includes(ty)){if(ty)toast(buildBlock(ty));return}S.place=S.place===ty?null:ty;updInfo(true)}
  else if(k==='escape'){if(S.place||S.rad||S.aim){S.place=null;closeRadial()}else openSheet()}
  else if(k===' '){ev.preventDefault();togglePause()}
  else if(k==='q'||k==='й')useAbility('orbital');
  else if(k==='w'||k==='ц')useAbility('emp');
  else if(k==='e'||k==='у')useAbility('shield');
  else if((k==='u'||k==='г')&&S.sel){if(S.sel.lvl<3&&upgrade(S.sel)){radKey='';renderRadial();updInfo(true)}}
  else if((k==='s'||k==='ы')&&S.sel){sell(S.sel);closeRadial()}
  else if((k==='t'||k==='е')&&S.sel){S.sel.mode=(S.sel.mode+1)%4;radKey='';renderRadial();updInfo(true)}
  else if(k==='n'||k==='т'){initAudio();startWave()}
});

/* ---------- loop ---------- */
function fit(){
  const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;
  tile=Math.max(12,Math.floor(Math.min(w/COLS,h/ROWS)));W=tile*COLS;H=tile*ROWS;dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';buildBg();if(S&&S.rad){radKey='';renderRadial()}
}
new ResizeObserver(fit).observe($('#stage'));
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(lobbyOn()){lbFrame(dt);requestAnimationFrame(loop);return}
  if(!S.paused&&!S.over&&!S.perkPick){const g=dt*speed,n=Math.ceil(g/(1/60)),h=g/n;for(let i=0;i<n;i++)update(h)}
  else if(S.over){for(const p of S.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}S.parts=S.parts.filter(p=>p.life>0)}
  draw();updHud();
  acc+=dt;if(acc>.2){acc=0;updInfo();if(S.rad)renderRadial();if(!SHEET.hidden)renderSheet()}
  requestAnimationFrame(loop);
}
newGame(0);fit();openLobby('home');requestAnimationFrame(loop);netInit();

})();
